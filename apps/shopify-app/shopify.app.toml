# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# application_url / auth.redirect_urls below are whatever local ngrok tunnel was active the last
# time `shopify app deploy` ran (docs/m1-verification.md, issue #67) — they go stale as soon as the
# tunnel restarts with a new subdomain. Re-run `shopify app deploy` after updating them for a new
# tunnel; don't rely on this file's URLs being current.

client_id = "6681fe25cb6f3beb8b97d9cdbd41630d"
application_url = "https://0fc9-2401-4900-1c5a-a3ac-a16c-a3db-5a66-989f.ngrok-free.app"
embedded = true
name = "Louis Belcher"

[webhooks]
api_version = "2026-07"

# Declarative subscriptions (issue #73): Shopify applies these to every shop with the app installed
# — existing installs included — on the next `shopify app deploy`, no runtime API call needed. Each
# block's `uri` matches a `:topic` group apps/api/src/routes/shopifyWebhooks.ts already handles
# (TOPIC_GROUPS); keep the two in sync if a topic is ever added or moved between groups.

[[webhooks.subscriptions]]
topics = ["orders/create", "orders/updated", "orders/cancelled"]
uri = "/webhooks/shopify/orders"

[[webhooks.subscriptions]]
topics = ["refunds/create", "fulfillments/create", "fulfillments/update"]
uri = "/webhooks/shopify/order-hints"

[[webhooks.subscriptions]]
topics = ["app/uninstalled", "bulk_operations/finish"]
uri = "/webhooks/shopify/app"

# Mandatory for every Shopify app (GDPR): customers/data_request, customers/redact, shop/redact.
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks/shopify/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_fulfillments (issue #73): required for the fulfillments/create and fulfillments/update
# webhook subscriptions below — keep in sync with packages/shared/src/shopify.ts's
# SHOPIFY_OAUTH_SCOPES, which is what the OAuth authorize URL actually requests.
scopes = "read_orders,read_fulfillments,write_pixels,read_customer_events"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://0fc9-2401-4900-1c5a-a3ac-a16c-a3db-5a66-989f.ngrok-free.app/v1/integrations/shopify/callback"
]
