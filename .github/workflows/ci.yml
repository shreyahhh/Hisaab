name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  db-migrations:
    runs-on: ubuntu-latest
    # Real Postgres + ClickHouse containers, so a bad migration (wrong SQL, an engine ClickHouse
    # rejects, a constraint Postgres rejects) fails the PR here instead of being caught later.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: truepath
          POSTGRES_PASSWORD: truepath
          POSTGRES_DB: truepath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truepath -d truepath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:26.8-alpine
        env:
          CLICKHOUSE_USER: truepath
          CLICKHOUSE_PASSWORD: truepath
          CLICKHOUSE_DB: truepath
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://truepath:truepath@localhost:5432/truepath
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: truepath
      CLICKHOUSE_PASSWORD: truepath
      CLICKHOUSE_DB: truepath
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Postgres migrations
        run: pnpm --filter @truepath/db db:migrate

      - name: Run ClickHouse migrations
        run: pnpm --filter @truepath/clickhouse db:migrate
