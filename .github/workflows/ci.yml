name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Tests run against real Postgres, ClickHouse and Redis (CLAUDE.md: no mocks for
    # tenancy-touching tests), so this job needs the same services as local docker-compose.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: truepath
          POSTGRES_PASSWORD: truepath
          POSTGRES_DB: truepath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truepath -d truepath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:26.8-alpine
        env:
          CLICKHOUSE_USER: truepath
          CLICKHOUSE_PASSWORD: truepath
          CLICKHOUSE_DB: truepath
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Durable Redis for the rate-limit tests (they use localhost:6379). Redis defaults to
      # maxmemory-policy noeviction, matching the durable instance's requirement (ADR-0019).
      redis-durable:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://truepath:truepath@localhost:5432/truepath
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: truepath
      CLICKHOUSE_PASSWORD: truepath
      CLICKHOUSE_DB: truepath
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  db-migrations:
    runs-on: ubuntu-latest
    # Real Postgres + ClickHouse containers, so a bad migration (wrong SQL, an engine ClickHouse
    # rejects, a constraint Postgres rejects) fails the PR here instead of being caught later.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: truepath
          POSTGRES_PASSWORD: truepath
          POSTGRES_DB: truepath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truepath -d truepath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:26.8-alpine
        env:
          CLICKHOUSE_USER: truepath
          CLICKHOUSE_PASSWORD: truepath
          CLICKHOUSE_DB: truepath
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://truepath:truepath@localhost:5432/truepath
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: truepath
      CLICKHOUSE_PASSWORD: truepath
      CLICKHOUSE_DB: truepath
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Via turbo, which builds the workspace packages the migrate scripts import (e.g. the built
      # `dist/` of @truepath/shared) first; plain `pnpm --filter` skips that.
      - name: Run Postgres migrations
        run: pnpm turbo run db:migrate --filter=@truepath/db

      - name: Run ClickHouse migrations
        run: pnpm turbo run db:migrate --filter=@truepath/clickhouse
